# Local development database only.
#
# The production stack is deploy/docker-compose.yml, symlinked to
# ~/Applications/gridiron/; this one exists so `pnpm db:migrate && pnpm db:seed`
# works from a clean checkout.
#
# Port 5433, not 5432: this machine already runs a host Postgres 17 on 5432.
# Production is 5434. Bound to 127.0.0.1 per docs/firewall.md — anything on a
# non-localhost address is reachable from every tailnet peer.
#
# The explicit project name matters. Without it compose derives the name from the
# directory, which is `gridiron` for this file AND for the production compose in
# ~/Applications/gridiron. Both define a service called `db`, so the second one
# started treats the first one's container as its own and recreates it — which is
# exactly what happened the first time production came up.
name: gridiron-dev

services:
  db:
    image: postgres:17-alpine
    container_name: gridiron-dev-db
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: gridiron
      POSTGRES_DB: gridiron
      TZ: America/Chicago
    volumes:
      - gridiron-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gridiron -d gridiron']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  gridiron-dev-pgdata:
    # Named explicitly, and deliberately keeping the `gridiron_` prefix compose
    # generated back when this project was called `gridiron`. Renaming the project
    # above would otherwise point at a fresh, empty volume and silently strand the
    # real 2020/2023/2025 ESPN data this database holds.
    name: gridiron_gridiron-dev-pgdata
